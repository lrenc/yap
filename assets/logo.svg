<svg xmlns="http://www.w3.org/2000/svg"
     width="160"
     height="120"
     viewBox="0 0 80 60"
     role="img"
     aria-labelledby="title">
  <title id="title">YAP logo</title>

  <g shape-rendering="crispEdges">
    <g fill="#86AAD6">
      <rect x="10" y="0" width="10" height="10"/>
      <rect x="60" y="0" width="10" height="10"/>
      <rect x="0" y="10" width="20" height="10"/>
      <rect x="60" y="10" width="20" height="10"/>
      <rect x="0" y="20" width="10" height="10"/>
      <rect x="70" y="20" width="10" height="10"/>
      <rect x="0" y="30" width="10" height="10"/>
      <rect x="70" y="30" width="10" height="10"/>
    </g>

    <g fill="#E7E4DC">
      <rect x="20" y="0" width="40" height="10"/>
      <rect x="20" y="10" width="40" height="10"/>
      <rect x="10" y="20" width="10" height="10"/>
      <rect x="30" y="20" width="20" height="10"/>
      <rect x="60" y="20" width="10" height="10"/>
      <rect x="10" y="30" width="20" height="10"/>
      <rect x="50" y="30" width="20" height="10"/>
      <rect x="10" y="40" width="20" height="10"/>
      <rect x="50" y="40" width="20" height="10"/>
    </g>

    <g fill="#27303B">
      <rect x="20" y="20" width="10" height="10"/>
      <rect x="50" y="20" width="10" height="10"/>
      <rect x="30" y="30" width="20" height="10"/>
    </g>

    <g fill="#E18B91">
      <rect x="30" y="40" width="20" height="10"/>
    </g>

    <g fill="#8FBC9B">
      <rect x="20" y="50" width="10" height="10"/>
      <rect x="50" y="50" width="10" height="10"/>
    </g>
  </g>
</svg>
